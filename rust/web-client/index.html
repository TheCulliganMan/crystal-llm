<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="dark">
    <link rel="icon" href="data:,">
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #000;
      }

      body > canvas {
        position: fixed !important;
        inset: 0 !important;
        display: block !important;
        width: 100vw !important;
        height: 100vh !important;
        margin: 0 !important;
        outline: 0 !important;
        image-rendering: pixelated;
      }

      #controls {
        position: fixed;
        z-index: 10;
        top: max(12px, env(safe-area-inset-top));
        right: max(12px, env(safe-area-inset-right));
        display: flex;
        gap: 8px;
      }

      button {
        min-width: 44px;
        height: 44px;
        padding: 0 12px;
        border: 1px solid #344054;
        border-radius: 12px;
        color: #fff;
        background: rgb(10 14 22 / 82%);
        font: 700 14px/1 system-ui, sans-serif;
        cursor: pointer;
        backdrop-filter: blur(8px);
      }

      button:hover,
      button:focus-visible {
        background: rgb(25 32 45 / 94%);
        outline: 2px solid #75d8ff;
        outline-offset: 2px;
      }

      dialog {
        width: min(340px, calc(100vw - 32px));
        border: 1px solid #344054;
        border-radius: 14px;
        color: #fff;
        background: #0a0e16;
        font: 15px/1.8 system-ui, sans-serif;
      }

      dialog::backdrop {
        background: rgb(0 0 0 / 70%);
      }

      dialog p {
        margin: 0 0 14px;
      }

      dialog button {
        width: 100%;
      }
    </style>
  </head>
  <body>
    <canvas id="crystal-canvas" tabindex="0"></canvas>
    <nav id="controls" aria-label="Display controls">
      <button id="fullscreen" type="button" aria-label="Fullscreen">⛶</button>
      <button id="help" type="button" aria-label="Controls">?</button>
    </nav>
    <dialog id="help-dialog">
      <p>Arrow keys — move<br>Z — interact<br>Enter — menu<br>X — back</p>
      <button id="close-help" type="button">Close</button>
    </dialog>
    <script type="module">
      import init from './crystal-bevy.js';
      import {
        initializeCrystalAudioSynth,
        synthesizeCrystalMidi,
      } from './audio-runtime/browser-synth.js';
      import audioSynthContext from './audio-runtime/context.js';

      const canvas = document.querySelector('canvas');
      document.querySelector('#fullscreen').addEventListener('click', async () => {
        if (document.fullscreenElement) {
          await document.exitFullscreen();
        } else {
          await document.documentElement.requestFullscreen();
        }
      });
      const helpDialog = document.querySelector('#help-dialog');
      document.querySelector('#help').addEventListener('click', () => helpDialog.showModal());
      document.querySelector('#close-help').addEventListener('click', () => helpDialog.close());
      canvas.addEventListener('pointerdown', () => canvas.focus({ preventScroll: true }));

      try {
        initializeCrystalAudioSynth(audioSynthContext);
        globalThis.__crystalSynthesizeMidi = synthesizeCrystalMidi;
        await init();
        canvas.focus({ preventScroll: true });
      } catch (error) {
        if (!String(error).includes('Using exceptions for control flow')) {
          console.error(error);
        }
      }
    </script>
  </body>
</html>
