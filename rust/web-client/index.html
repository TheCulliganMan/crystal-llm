<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="dark">
    <meta name="referrer" content="no-referrer">
    <link rel="icon" href="data:,">
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #000;
      }

      body > canvas {
        position: fixed !important;
        inset: 0 !important;
        display: block !important;
        width: 100vw !important;
        height: 100vh !important;
        margin: 0 !important;
        outline: 0 !important;
        image-rendering: pixelated;
      }

      #controls {
        position: fixed;
        z-index: 10;
        top: max(12px, env(safe-area-inset-top));
        right: max(12px, env(safe-area-inset-right));
        display: flex;
        gap: 8px;
      }

      button {
        min-width: 44px;
        height: 44px;
        padding: 0 12px;
        border: 1px solid #344054;
        border-radius: 12px;
        color: #fff;
        background: rgb(10 14 22 / 82%);
        font: 700 14px/1 system-ui, sans-serif;
        cursor: pointer;
        backdrop-filter: blur(8px);
      }

      button:hover,
      button:focus-visible {
        background: rgb(25 32 45 / 94%);
        outline: 2px solid #75d8ff;
        outline-offset: 2px;
      }

      dialog {
        width: min(340px, calc(100vw - 32px));
        border: 1px solid #344054;
        border-radius: 14px;
        color: #fff;
        background: #0a0e16;
        font: 15px/1.8 system-ui, sans-serif;
      }

      dialog::backdrop {
        background: rgb(0 0 0 / 70%);
      }

      dialog p {
        margin: 0 0 14px;
      }

      dialog button {
        width: 100%;
      }
    </style>
  </head>
  <body>
    <canvas id="crystal-canvas" tabindex="0"></canvas>
    <dialog id="startup-error" aria-label="Unable to start game">
      <p id="startup-error-message"></p>
      <button id="retry-start" type="button">Reload</button>
    </dialog>
    <nav id="controls" aria-label="Display controls">
      <button id="fullscreen" type="button" aria-label="Fullscreen">⛶</button>
      <button id="help" type="button" aria-label="Controls">?</button>
    </nav>
    <dialog id="help-dialog">
      <p id="webmcp-status" role="status">Agent tools: checking WebMCP support.</p>
      <p>Arrow keys — move<br>Z — interact<br>Enter — menu<br>X — back</p>
      <button id="close-help" type="button">Close</button>
    </dialog>
    <script type="module">
      import { createGameBridge, registerGameTools } from './webmcp.js';
      import { startOnlineSession, runWithPlayerLock } from './browser-session.js';
      import {
        initializeCrystalAudioSynth,
        synthesizeCrystalMidi,
      } from './audio-runtime/browser-synth.js';
      import audioSynthContext from './audio-runtime/context.js';

      const canvas = document.querySelector('canvas');
      document.querySelector('#fullscreen').addEventListener('click', async () => {
        if (document.fullscreenElement) {
          await document.exitFullscreen();
        } else {
          await document.documentElement.requestFullscreen();
        }
      });
      const helpDialog = document.querySelector('#help-dialog');
      document.querySelector('#help').addEventListener('click', () => helpDialog.showModal());
      document.querySelector('#close-help').addEventListener('click', () => helpDialog.close());
      canvas.addEventListener('pointerdown', () => canvas.focus({ preventScroll: true }));

      const isEventLoopHandoff = error => String(error).includes('Using exceptions for control flow');
      const showStartupError = error => {
        if (isEventLoopHandoff(error)) return;
        document.querySelector('#startup-error-message').textContent = String(error?.message ?? error);
        const dialog = document.querySelector('#startup-error');
        if (!dialog.open) dialog.showModal();
      };
      document.querySelector('#retry-start').addEventListener('click', () => location.reload());
      window.addEventListener('unhandledrejection', event => showStartupError(event.reason));
      try {
        const session = await startOnlineSession({ url: location.href, localStorage, sessionStorage, crypto, fetch });
        history.replaceState(null, '', session.url);
        await runWithPlayerLock(navigator.locks, session.playerId, async () => {
          initializeCrystalAudioSynth(audioSynthContext);
          globalThis.__crystalSynthesizeMidi = synthesizeCrystalMidi;
          const wasm = await import('./crystal-bevy.js');
          const { default: init } = wasm;
          try {
            await init();
          } catch (error) {
            if (!isEventLoopHandoff(error)) throw error;
          }
          const bridge = createGameBridge(wasm);
          let lifetime = new AbortController();
          window.addEventListener('pagehide', () => { bridge.cancel(); lifetime.abort(); });
          window.addEventListener('keydown', event => { if (event.isTrusted) bridge.cancel(); }, { capture: true });
          window.addEventListener('blur', () => bridge.cancel());
          document.addEventListener('visibilitychange', () => { if (document.hidden) bridge.cancel(); });
          const enableAgentTools = async () => {
            try {
              const registration = await registerGameTools(document, bridge, { signal: lifetime.signal });
              document.querySelector('#webmcp-status').textContent = registration.supported
                ? 'Agent tools ready: observe the game and press Game Boy buttons through WebMCP.'
                : 'This browser does not support the current WebMCP API. Keyboard play is available.';
            } catch (error) {
              document.querySelector('#webmcp-status').textContent = `Agent tools unavailable: ${error.message}`;
            }
          };
          window.addEventListener('pageshow', event => {
            if (event.persisted) { lifetime = new AbortController(); void enableAgentTools(); }
          });
          await enableAgentTools();
          canvas.focus({ preventScroll: true });
        });
      } catch (error) {
        showStartupError(error);
      }
    </script>
  </body>
</html>
