[package]
name = "crystal-bevy"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
anyhow.workspace = true
bevy = { version = "0.14", optional = true, default-features = false, features = [
    "bevy_asset",
    "bevy_core_pipeline",
    "bevy_render",
    "bevy_sprite",
    "bevy_text",
    "bevy_ui",
    "bevy_winit",
    "webgl2",
] }
chrono.workspace = true
crystal-assets = { path = "../crystal-assets" }
crystal-audio = { path = "../crystal-audio" }
crystal-core = { path = "../crystal-core" }
crystal-net = { path = "../crystal-net" }
crystal-render-api = { path = "../crystal-render-api", optional = true }
crystal-voxel-view = { path = "../crystal-voxel-view", optional = true }
flate2 = "1.1"
image = { version = "0.25.10", default-features = false, features = ["png"] }
serde_json.workspace = true
thiserror.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bevy = { version = "0.14", optional = true, default-features = false, features = ["multi_threaded", "x11"] }
rodio = { version = "0.18.1", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "AudioBuffer",
    "AudioBufferSourceNode",
    "AudioContext",
    "AudioDestinationNode",
    "AudioNode",
    "Response",
    "Window",
] }
uuid = { version = "1", features = ["js"] }

[features]
default = ["bevy-shell"]
bevy-shell = ["dep:bevy", "dep:crystal-render-api"]
voxel-view = ["bevy-shell", "dep:crystal-voxel-view"]
location-tester = ["voxel-view", "crystal-assets/test-fixtures"]

[[example]]
name = "render_at_location"
required-features = ["location-tester"]

[[example]]
name = "audit_voxel_coverage"
required-features = ["location-tester"]

[dev-dependencies]
crystal-assets = { path = "../crystal-assets", features = ["test-fixtures"] }
crystal-core = { path = "../crystal-core", features = ["test-fixtures"] }
