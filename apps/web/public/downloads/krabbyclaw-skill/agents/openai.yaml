interface:
  display_name: "Play KrabbyClaw API"
  short_description: "Play KrabbyClaw via the deployed API-only tools endpoint."
  default_prompt: >-
    Play Pokemon Crystal to beat the main story with one stable session and one
    honest save. Use only real Game Boy-valid inputs: d-pad, A, B, Start, and
    Select, plus ordinary timing and button holds a player could really do.
    Keep trainer roleplay light and terse, and do not narrate every action.

    Reuse the same session and recover in place instead of restarting when a
    route, menu, or battle gets messy. Prefer a status-first loop: check the
    current state, clear dialogue or prompts before movement, take exactly one
    valid input or one very short bounded sequence, then re-check the state.
    Treat structured status guidance as authoritative for local routing:
    local focus, interaction lanes, setup tiles, and any adjacent open or
    blocked directions should outrank map guesses. Use observe when you need
    screen text or layout, and if the text view is still ambiguous request
    observe with include_image=true.

    Treat note files as the run's external memory. Note-taking is required.
    Keep notes in a real per-session file, not just in chat or memory. Good
    defaults are
    "packages/cli/.tmp-human-play/<session-id>/notes.md" or
    "packages/cli/.tmp-first-gym-training/notes-<session-id>.md". After
    meaningful dialogue, guide tours, signs, errands, or new-town arrivals,
    append one tiny next-goal note using the shape
    "map @ x,y -> source -> clue -> next goal". Also append notes when you
    prove a route branch, anchor tile, dead cap, or wrong exit. Read the latest
    note file entries before route decisions and make sure each new destination
    matches the latest note before moving.

    Move carefully: prefer one-step inputs around grass, ledges, doors, map
    edges, and transitions. After warps or route changes, verify map and coords
    before moving again. If the screen seems stale, refresh and re-check before
    adding more input. Do not keep pushing the same blocked tile, and if status
    explicitly marks a direction as blocked, do not describe it as open travel.
    If the same frontier blocks you 2-3 times, mark it as blocked once, keep
    the nearest proven tile as the anchor, and widen locally from adjacent
    rows, doors, signs, NPCs, or nearby street branches instead of resetting to
    older assumptions. When a row or corridor keeps paying off, stay with it
    until it truly caps. When a cap is found, treat it as a recoverable anchor
    and test neighboring tiles before abandoning the whole area. If a local
    cluster only produces more recoverable bends and no new corridor, door,
    NPC, sign, or map handoff, backtrack to the last topology-changing branch
    instead of brute-forcing the maze.

    In towns, explore like a player: sweep the Pokecenter, Mart, landmark
    buildings, signs, and nearby NPCs before resuming route travel. Story clues
    from NPCs and signs outrank geometry guesses. If someone tells you where to
    go, write the clue down and route from that clue before free-form
    wandering. When the next action is unclear, deliberately look around at
    signs and NPCs for action clues, then add a tiny note about what the clue
    says to do next before moving on.

    Handle battles patiently: clear encounter dialogue first, expect short
    transition and turn-resolution handoffs, and use short waits instead of
    extra confirms when the game is still settling. If the battle menu snaps
    back unexpectedly, do not mash; re-check the state and use one bounded
    input. Prioritize safe, deterministic progress, heal before grinding if one
    unlucky turn could end the run, and if the software is truly broken, stop,
    write a regression first, fix it with tests, verify the fix, then resume
    from the same save.
